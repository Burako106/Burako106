<script id="net-js">
/* ==========================================================================
   Burako 106 — Mesas online (1 contra 1, 3 jugadores y 2 contra 2)
   --------------------------------------------------------------------------
   Quien crea la mesa es el "anfitrión": reparte las fichas y, en los lugares
   que no ocupa ninguna persona, juega la máquina desde su navegador.
   Cada persona hace sus movimientos en su propio dispositivo y, después de
   cada movimiento, el estado de la partida viaja a los demás a través del
   servidor (Cloudflare), que además guarda el último estado para poder
   volver si alguien recarga la página o se corta internet.
   ========================================================================== */
(function(){
  const GAME=['n','hands','muertos','taken','melds','rules','pozo','mazo','turn','phase','totals','round','over','mid','goal','freeM','muertoMazo','lastDisc','actor','drawn','mode','timer','seatInfo'];
  const clone=o=>JSON.parse(JSON.stringify(o));
  const NET={role:null,code:null,ws:null,v:0,last:'',ev:[],seat:0,n:2,seats:null,open:false,on:{},retry:0,timer:null,ping:null,ui:null,pub:false,want:null,nextAt:null};
  window.BURAKO_NET=NET; NET._ui=()=>readyUI();
  // Modo prueba: los videos dan tickets sin límite (las compras ya son simuladas)
  try{ ECO.VIDEO_MAX=999; ECO.VIDEO_GAP=0; }catch(e){}
  const PEN=e=>Math.round((e||ECO.ENTRIES[0])*.5);   // penalización por abandonar: la mitad de la entrada, además de perderla
  const online=()=>!!(S&&S.kind==='online'&&NET.code&&S.net&&S.net.code===NET.code);

  /* ---------- Perspectivas ----------
     En pantalla "vos" sos siempre el asiento 0. El estado que viaja por la red
     está del lado del anfitrión; cada invitado lo gira según su asiento. */
  const NTn=n=>n===3?3:2;
  function rotArr(a,k){ if(!Array.isArray(a)) return a; const L=a.length; if(!L) return a.slice(); k=((k%L)+L)%L; return a.map((_,i)=>a[(i+k)%L]); }
  function rot(g,k){
    const o=clone(g), n=o.n||2, kt=n===3?k:k%2, fp=p=>typeof p==='number'?(((p-k)%n)+n)%n:p;
    o.hands=rotArr(o.hands,k); ['muertos','taken','melds','totals'].forEach(x=>{ o[x]=rotArr(o[x],kt); });
    o.turn=fp(o.turn); o.lastDisc=fp(o.lastDisc); o.actor=fp(o.actor);
    if(o.over){ o.over.closer=fp(o.over.closer); o.over.rows=rotArr(o.over.rows,kt); }
    return o;
  }
  function pick(){ const g={}; GAME.forEach(k=>{ g[k]=S[k]===undefined?null:S[k]; }); return clone(g); }
  const canon=()=>NET.seat?rot(pick(),-NET.seat):pick();
  const toView=c=>(c+(-NET.seat)%NET.n+NET.n)%NET.n;           // asiento real -> asiento en mi pantalla
  const toCanon=p=>(p+NET.seat)%NET.n;                          // asiento en mi pantalla -> asiento real
  const nameC=c=>{ try{ return nm(toView(c)); }catch(e){ return 'Alguien'; } };
  // El "jefe" de la mesa es la primera persona conectada: reparte y juega por la máquina.
  function bossCanon(){ const si=(S&&S.seatInfo)||[]; for(let c=0;c<si.length;c++){ const s=si[c]; if(!s||s.t==='b') continue; if(s.pid===myPid()||NET.on[s.pid]) return c; } return 0; }
  const isBoss=()=>online()&&bossCanon()===NET.seat;
  const infoAt=p=>S&&S.seatInfo&&S.seatInfo[toCanon(p)];
  NET.botTurn=()=>!!(isBoss()&&!S.over&&infoAt(S.turn)&&infoAt(S.turn).t==='b');

  /* ---------- Identidad ---------- */
  function myPid(){ let id=''; try{ id=localStorage.getItem('burako-pid')||''; if(!id){ id=Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('burako-pid',id); } }catch(e){ id=NET.tmpPid||(NET.tmpPid=Math.random().toString(36).slice(2)); } return id; }
  function myName(){ let n='Jugador'; try{ n=localStorage.getItem('burako-name')||'Jugador'; }catch(e){} return n.slice(0,18); }
  // Mi personaje: el mismo en el perfil, en el lobby y en las mesas (se guarda en este dispositivo)
  function ensureMyCav(){
    if(!(typeof myCav==='number'&&myCav>=0&&myCav<CC_AV.b.length)){
      myCav=(S&&S.cav&&S.cav[0]>=0&&S.cav[0]<CC_AV.b.length)?S.cav[0]:Math.floor(Math.random()*CC_AV.b.length);
      try{ localStorage.setItem('burako-cav',String(myCav)); }catch(e){}
    }
    return myCav;
  }
  function pickMe(el){
    const old=document.getElementById('cavpop'); if(old){ old.remove(); return; }
    const cur=ensureMyCav(), d=document.createElement('div'); d.id='cavpop'; d.className='cavpop netcav'; d.setAttribute('role','dialog'); d.setAttribute('aria-label','Elegí tu personaje');
    d.innerHTML='<span class="label">Elegí tu personaje</span><div class="cav-grid">'+CC_AV.b.map((src,i)=>'<button class="cav-it'+(i===cur?' on':'')+'" data-act="mypick" data-v="'+i+'" style="--d:'+(i*28)+'ms" aria-label="Personaje '+(i+1)+'"><img src="'+src+'" alt=""></button>').join('')+'<button class="cav-it cav-add" data-act="myphoto" aria-label="Elegir mi propia foto" title="Elegir mi propia foto">+</button></div>';
    document.body.appendChild(d);
    const r=el.getBoundingClientRect(), w=d.offsetWidth, hh=d.offsetHeight;
    d.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left))+'px';
    d.style.top=(r.bottom+12+hh<innerHeight?r.bottom+12:Math.max(8,r.top-hh-12))+'px';
  }
  function setMine(i){
    myCav=i; try{ localStorage.setItem('burako-cav',String(i)); localStorage.removeItem('burako-photo'); }catch(e){} try{ photo=null; }catch(e){}
    if(S&&S.cav&&!online()){ try{ setMyCav(i); }catch(e){} }
    // en medio de una partida online: los demás ven el cambio al instante
    if(online()&&S.seatInfo){ const c=S.seatInfo.findIndex(s=>s&&s.pid===myPid()); if(c>=0){ S.seatInfo[c].cav=i; applySeats(); render(); pushNow(true); } }
    // si estoy sentado esperando en una mesa, que los demás vean el cambio
    if(NET.code&&!online()&&NET.seats){ const s=NET.seats.find(x=>x&&x.pid===myPid()); if(s){ s.cav=i; if(NET.role==='host'){ sendSeats(); list(); } else send({t:'hello',...myWho(),pw:NET.pw||''}); } }
    const c=document.getElementById('cavpop'); if(c) c.remove();
    try{ if(typeof renderLobby==='function') renderLobby(); }catch(e){} try{ render(); }catch(e){}
  }
  function myWho(){ return {name:myName(),cav:ensureMyCav(),pid:myPid(),seat:NET.want,cap:NET.role==='host'?NET.n-1:undefined}; }
  const okCav=c=>Number.isInteger(c)&&c>=0&&c<CC_AV.b.length;

  /* ---------- Conexión ---------- */
  function wsURL(){ return (location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?mesa='+encodeURIComponent(NET.code)+'&role='+NET.role; }
  function send(m){ if(NET.ws&&NET.ws.readyState===1){ try{ NET.ws.send(JSON.stringify(m)); return true; }catch(e){} } return false; }
  function connect(){
    clearTimeout(NET.timer);
    if(NET.ws){ try{ NET.ws.onclose=null; NET.ws.close(); }catch(e){} }
    let ws; try{ ws=new WebSocket(wsURL()); }catch(e){ schedule(); return; }
    NET.ws=ws; badge();
    ws.onopen=()=>{ NET.open=true; NET.retry=0; send({t:'hello',who:myWho(),pw:NET.pw||''}); badge(); netUI();
      clearInterval(NET.ping); NET.ping=setInterval(()=>send({t:'ping'}),25000); };
    ws.onmessage=e=>{ let m; try{ m=JSON.parse(e.data); }catch(x){ return; } try{ onMsg(m); }catch(x){ console.error(x); } };
    ws.onclose=ev=>{ NET.open=false; clearInterval(NET.ping); badge(); netUI(); if(ev&&(ev.code===4000||ev.code===4001||ev.code===4002)) return; schedule(); };
    ws.onerror=()=>{};
  }
  function schedule(){ clearTimeout(NET.timer); const d=Math.min(15000,800*Math.pow(1.7,NET.retry++)); NET.timer=setTimeout(()=>{ if(NET.code) connect(); },d); }
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&NET.code&&(!NET.ws||NET.ws.readyState>1)){ NET.retry=0; connect(); } });
  window.addEventListener('online',()=>{ if(NET.code){ NET.retry=0; connect(); } });

  /* ---------- Mensajes ---------- */
  function onMsg(m){
    if(m.t==='pong') return;
    if(m.t==='needpw'){ if(NET.role==='guest') pwScreen(!!m.bad); return; }
    if(m.t==='full'){ const was=NET.role; leaveOnline(); closeUI(); toast(was==='guest'?'Esa mesa ya se llenó. Elegí otra o creá una.':'Esta mesa ya la está usando otra persona.'); lbRefresh(); return; }
    if(m.t==='sync'){
      const r=m.room||{}; NET.on={}; (m.online||[]).forEach(pid=>{ NET.on[pid]=true; });
      if(NET.role==='host'){
        if(online()){ if(r.state&&(r.v||0)>NET.v) apply(r.state,r.v,true); else pushNow(true); }
        else { // reconstruir quién está sentado (si recargué mientras esperaba)
          Object.values(r.guests||{}).forEach(w=>{ if(NET.on[w.pid]) seatGuest(w); });
          sendSeats(); list(); maybeAutoStart();
        }
      } else {
        if(r.seats) NET.seats=r.seats; if(r.n) NET.n=r.n; if(r.bet) NET.bet=r.bet; if(!online()) betCheck();
        if(r.host) NET.hostName=r.host.name;
        if(r.state&&(!online()||(r.v||0)>=NET.v)) apply(r.state,r.v||1,true); else if(online()) pushNow(true);
      }
      badge(); netUI(); return;
    }
    if(m.t==='presence'){
      if(m.on) NET.on[m.pid]=true; else delete NET.on[m.pid];
      if(NET.role==='host'&&!online()){
        if(!m.on&&m.role==='guest'){ unseat(m.pid); }
      } else if(online()){
        if(m.on&&NET.role==='host') pushNow(true);
        if(!m.on&&!S.over){ const i=(S.seatInfo||[]).findIndex(s=>s&&s.pid===m.pid); if(i>=0) toast(S.seatInfo[i].name+' se desconectó. Si no vuelve en 20 segundos, entra la máquina en su lugar.'); }
        setTimeout(()=>{ if(NET.botTurn()) runBots(); },300);
      }
      badge(); netUI(); render(); return;
    }
    if(m.t==='bye'){ if(online()){ (NET.gone=NET.gone||new Set()).add(m.pid); return; } if(NET.role==='host') unseat(m.pid); return; }
    if(m.t==='again'){ if(NET.role==='host'&&gameOver()) startRematch(m.pid); return; }
    if(m.t==='newhost'){ NET.hostPid=m.pid; if(m.pid===myPid()){ NET.role='host'; if(NET.wantClaim&&gameOver()){ NET.wantClaim=false; startRematch(myPid()); } } return; }
    if(m.t==='rematch'){
      if(!gameOver()) return; const me=myPid();

  async function finishUp(su){
    const C=window.Clerk;
    if(su.status==='complete'&&su.createdSessionId){ flow=null; await C.setActive({session:su.createdSessionId}); return 'ok'; }
    if(su.status!=='missing_requirements') throw {errors:[{message:su.status}]};

  function pwBox(){
    const box=document.querySelector('#ecologin .el-mailbox'); if(!box) return; status('');
    box.innerHTML=`<p class="el-codehint">${en()?'Email confirmed ✓ Last step: choose a password.':'Email confirmado ✓ Último paso: elegí una contraseña.'}<br><small>${en()?'At least '+pwMin()+' characters. Avoid very common ones.':'Mínimo '+pwMin()+' caracteres. Evitá las muy comunes.'}</small></p>
      <label class="el-field"><span>${en()?'Password':'Contraseña'}</span><input name="pw" type="password" autocomplete="new-password" minlength="${pwMin()}" required></label>
      <button class="el-btn el-mail" type="submit">${en()?'Create account':'Crear cuenta'}</button>`;
    let busy=false;
    box.onsubmit=async ev=>{ ev.preventDefault(); if(busy) return; busy=true; const b=box.querySelector('button'); b.disabled=true; status(en()?'Creating…':'Creando…');
      try{ const su=await window.Clerk.client.signUp.update({password:box.pw.value}); await finishUp(su); }
      catch(e){ console.warn(e); status(errMsg(e)); b.disabled=false; }
      busy=false; };
    setTimeout(()=>box.pw.focus(),50);
  }
  // eliminar cuenta: confirma, borra el jugador en el servidor y la cuenta en Clerk, limpia este dispositivo
  function delDialog(){
    const E_=en(); ecoView='delacc';
    let m=document.getElementById('ecomodal'); if(!m){ m=document.createElement('div'); m.id='ecomodal'; document.body.appendChild(m); }
    const mail=(E.account&&E.account.email)||'';
    m.innerHTML=`<div class="eco-bg" data-eco="close"></div><div class="eco-card-w del-card" role="dialog" aria-modal="true"><button class="eco-x" data-eco="close" aria-label="${E_?'Close':'Cerrar'}">×</button>
      <h2>${E_?'Delete your account?':'¿Eliminar tu cuenta?'}</h2>
      <p class="eco-p">${E_?'We’ll delete your account':'Vamos a borrar tu cuenta'}${mail?` <b></b>`:''} ${E_?'and everything linked to it: name, photo, tickets and stats.':'y todo lo asociado: nombre, foto, tickets y estadísticas.'}</p>
      <p class="eco-p del-warn">${E_?'This can’t be undone.':'No se puede deshacer.'}</p>
      <div class="eco-col"><button class="btn del-go" type="button">${E_?'Delete my account':'Eliminar mi cuenta'}</button><button class="btn" data-eco="close">${E_?'Cancel':'Cancelar'}</button></div>
      <p class="del-msg" hidden></p></div>`;
    if(mail) m.querySelector('.eco-p b').textContent=mail;
    m.hidden=false;
    const go=m.querySelector('.del-go'), msg=m.querySelector('.del-msg');
    go.onclick=async()=>{ go.disabled=true; go.textContent=E_?'Deleting…':'Eliminando…'; msg.hidden=true;
      try{
        const C=window.Clerk; if(!C||!C.user) throw new Error('nouser');
        try{ await api('DELETE'); }catch(e){ console.warn('server',e); }
        try{ await C.user.delete(); }catch(e){ console.warn('clerk',e); throw e; }
        // limpiar lo guardado en este dispositivo
        ['burako-name','burako-photo','burako-cav','burako-stats'].forEach(k=>{ try{ rm0.call(localStorage,k); }catch(e){} });
        try{ photo=null; }catch(e){}
        Object.assign(E,{account:null,bal:0,sub:null,ledger:[]}); ecoSave();
        m.hidden=true; m.innerHTML=''; ecoView=null;
        try{ lcfgOpen=false; renderLobby(); }catch(e){}
        try{ await C.signOut(); }catch(e){}
        onSignedOut();
        setTimeout(()=>ecoNote(E_?'Your account was deleted.':'Tu cuenta fue eliminada.'),300);
      }catch(e){
        go.disabled=false; go.textContent=E_?'Delete my account':'Eliminar mi cuenta';
        msg.hidden=false; msg.textContent=E_?'We couldn’t delete it. Try again or write to info@burako106.com.':'No se pudo eliminar. Probá de nuevo o escribinos a info@burako106.com.';
      } };
  }
  document.addEventListener('click',e=>{ const b=e.target.closest('[data-act="lcfgdel"]'); if(!b) return; e.preventDefault(); e.stopPropagation(); delDialog(); },true);
  // ===== Saldo de tickets en el servidor =====
  // Cada movimiento (entrada, premio, video…) se muestra al instante y se manda al servidor, que es el que decide el saldo real.
  const ecoTx0=window.ecoTx, TXQ='burako-txq';
  let txq=[], flushing=false, curGame=null;
  try{ txq=JSON.parse(localStorage.getItem(TXQ)||'[]')||[]; }catch(e){ txq=[]; }
  const saveQ=()=>{ try{ set0.call(localStorage,TXQ,JSON.stringify(txq.slice(-200))); }catch(e){} };
  const rid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
  async function walletCall(body){
    const tok=await window.Clerk.session.getToken();
    const r=await fetch('/api/wallet',{method:'POST',headers:{authorization:'Bearer '+tok,'content-type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok) throw new Error('wallet '+r.status); return r.json();
  }
  function setBal(b){ if(typeof b!=='number') return; E.bal=b; ecoSave(); try{ if(ecoView==='store') ecoOpen('store'); }catch(e){} }
  async function walletSync(){ try{ const r=await walletCall({}); if(!txq.length) setBal(r.bal); return r.bal; }catch(e){ return null; } }
  async function walletStart(mine){
    try{
      const uid=ACC.user&&ACC.user.id;
      txq=txq.filter(t=>t.u===uid); saveQ(); // movimientos pendientes de otra cuenta no se mandan
      const r=await walletCall({init:{mine,bal:E.bal,signupGiven:!!E.signupGiven}});
      ACC.wallet=true; E.signupGiven=true;
      if(r.init&&r.init.gift>0) setTimeout(()=>ecoNote(`${TKI}<b>+${ecoN(r.init.gift)}</b> ${en()?'free tickets. Welcome!':'tickets de regalo. ¡Bienvenido/a!'}`,'up'),400);
      if(!txq.length) setBal(r.bal); else flush();
    }catch(e){ console.warn('saldo',e); }
  }
  async function flush(){
    if(flushing||!txq.length||!ACC.wallet) return; flushing=true;
    try{
      const batch=txq.slice(0,20);
      const r=await walletCall({tx:batch.map(({id,delta,kind,meta})=>({id,delta,kind,meta}))});
      const done=new Set((r.results||[]).map(x=>x.id)); txq=txq.filter(t=>!done.has(t.id)); saveQ();
      (r.results||[]).filter(x=>!x.ok).forEach(x=>console.warn('movimiento rechazado',x));
      if(!txq.length) setBal(r.bal);
    }catch(e){ setTimeout(()=>{ flushing=false; flush(); },5000); return; }
    flushing=false; if(txq.length) setTimeout(flush,200);
  }
  window.ecoTx=function(amount,type,meta){
    if(!ACC.user||!ACC.wallet) return ecoTx0(amount,type,meta); // invitados: como antes, solo en este dispositivo
    meta=Object.assign({},meta||{});
    const id=type+'-'+rid();
    if(type==='entry') curGame=id;
    if((type==='prize'||type==='refund'||type==='puramadre')&&curGame) meta.game=curGame;
    ecoTx0(amount,type,meta); // se ve al instante
    if(type==='purchase'||type==='signup') return;
    txq.push({id,delta:amount,kind:type,meta,u:ACC.user.id}); saveQ(); flush();
  };
  window.addEventListener('online',()=>flush());
  setInterval(()=>{ if(ACC.wallet&&!txq.length&&document.visibilityState==='visible') walletSync(); },60000);

  // ===== Mercado Pago: comprar tickets =====
  const ecoBuy0=window.ecoBuy;
  window.ecoBuy=async function(kind,id){
    if(kind==='sub') return subStart(id);
    if(kind!=='pack') return ecoBuy0(kind,id);
    const b=document.querySelector(`[data-eco="buy"][data-k="pack"][data-v="${id}"]`);
    if(!ACC.user||!window.Clerk||!window.Clerk.session){ ecoNote(en()?'Sign in with an account (Google, Facebook or email) to buy tickets.':'Para comprar tickets entrá con una cuenta (Google, Facebook o email).'); return; }
    if(b){ b.disabled=true; b.textContent=en()?'Opening Mercado Pago…':'Abriendo Mercado Pago…'; }
    try{
      const tok=await window.Clerk.session.getToken();
      const r=await fetch('/api/mp/checkout',{method:'POST',headers:{authorization:'Bearer '+tok,'content-type':'application/json'},body:JSON.stringify({pack:id})});
      const j=await r.json().catch(()=>({}));
      if(j.error==='no-test'){ if(b){ b.disabled=false; b.textContent=en()?'Buy':'Comprar'; } ecoNote(en()?'Payments are paused: the store isn’t in test mode yet.':'Pagos en pausa: la tienda todavía no está en modo prueba.'); return; }
      if(!r.ok||!j.url) throw new Error(j.error||('http '+r.status));
      location.href=j.url;
    }catch(e){ console.warn('mp',e); if(b){ b.disabled=false; b.textContent=en()?'Buy':'Comprar'; } ecoNote(en()?'Couldn’t open Mercado Pago. Try again.':'No se pudo abrir Mercado Pago. Probá de nuevo.'); }
  };
  // ===== Suscripciones con Mercado Pago =====
  async function mpPost(path,body){
    const tok=await window.Clerk.session.getToken();
    const r=await fetch(path,{method:'POST',headers:{authorization:'Bearer '+tok,'content-type':'application/json'},body:JSON.stringify(body||{})});
    const j=await r.json().catch(()=>({})); if(!r.ok) { const e=new Error(j.error||('http '+r.status)); e.code=j.error; throw e; } return j;
  }
  function setSub(sub){ // el estado real viene del servidor
    if(!ACC.user) return;
    E.sub=sub&&sub.until>Date.now()?{plan:sub.plan,until:sub.until,cancelled:!!sub.cancelled,id:sub.id}:null; ecoSave();
    try{ if(ecoView==='store') ecoOpen('store'); }catch(e){}
  }
  async function subRefresh(id){ try{ const r=await mpPost('/api/mp/sub/check',id?{id}:{}); setSub(r.sub); return r.sub; }catch(e){ return null; } }
  function subStart(plan){
    const E_=en();
    if(!ACC.user||!window.Clerk||!window.Clerk.session){ ecoNote(E_?'Sign in with an account (Google, Facebook or email) to subscribe.':'Para suscribirte entrá con una cuenta (Google, Facebook o email).'); return; }
    if(E.sub&&E.sub.until>Date.now()&&!E.sub.cancelled){ ecoNote(E_?'You already have an active subscription.':'Ya tenés una suscripción activa.'); return; }
    const pl=ECO.SUBS.find(x=>x.id===plan); if(!pl) return;
    ecoView='subemail';
    let m=document.getElementById('ecomodal'); if(!m){ m=document.createElement('div'); m.id='ecomodal'; document.body.appendChild(m); }
    m.innerHTML=`<div class="eco-bg" data-eco="close"></div><div class="eco-card-w del-card" role="dialog" aria-modal="true"><button class="eco-x" data-eco="close" aria-label="${E_?'Close':'Cerrar'}">×</button>
      <h2>${E_?'Subscription':'Suscripción'} ${pl.name.toLowerCase()}</h2>
      <p class="eco-p">${ecoMoney(pl.ars)} ${pl.id==='anual'?(E_?'per year':'por año'):(E_?'per month':'por mes')}. ${E_?'Mercado Pago charges it automatically; you can cancel anytime from the store.':'Mercado Pago lo cobra solo y podés cancelarla cuando quieras desde la tienda.'}</p>
      <form class="sub-f"><label class="el-field"><span>${E_?'Your Mercado Pago email':'Tu email de Mercado Pago'}</span><input name="mail" type="email" required></label>
      <p class="eco-p" style="font-size:13px;opacity:.75">${E_?'Use the same email you use to sign in to Mercado Pago.':'Usá el mismo email con el que entrás a Mercado Pago.'}</p>
      <div class="eco-col"><button class="btn primary sub-go" type="submit">${E_?'Continue to Mercado Pago':'Continuar a Mercado Pago'}</button><button class="btn" type="button" data-eco="close">${E_?'Cancel':'Cancelar'}</button></div></form>
      <p class="del-msg" hidden></p></div>`;
    m.hidden=false;
    const f=m.querySelector('.sub-f'), msg=m.querySelector('.del-msg'), go=m.querySelector('.sub-go');
    f.mail.value=(E.account&&E.account.email)||'';
    f.onsubmit=async ev=>{ ev.preventDefault(); go.disabled=true; go.textContent=E_?'Opening Mercado Pago…':'Abriendo Mercado Pago…'; msg.hidden=true;
      try{ const j=await mpPost('/api/mp/sub',{plan,email:f.mail.value}); location.href=j.url; }
      catch(e){ go.disabled=false; go.textContent=E_?'Continue to Mercado Pago':'Continuar a Mercado Pago'; msg.hidden=false;
        msg.textContent=e.code==='no-test'?(E_?'Payments are paused: the store isn’t in test mode yet.':'Pagos en pausa: la tienda todavía no está en modo prueba.'):e.code==='email'?(E_?'Check the email.':'Revisá el email.'):e.code==='email-mp'?(E_?'Mercado Pago didn’t accept that email. It must be the email of the Mercado Pago account that will pay (in test mode, a test account).':'Mercado Pago no aceptó ese email. Tiene que ser el de la cuenta de Mercado Pago que va a pagar (en modo prueba, una cuenta de prueba).'):e.code==='ya-activa'?(E_?'You already have an active subscription.':'Ya tenés una suscripción activa.'):(E_?'Couldn’t open Mercado Pago. Try again.':'No se pudo abrir Mercado Pago. Probá de nuevo.'); } };
    setTimeout(()=>f.mail.focus(),50);
  }
  function subCancelDialog(){
    const E_=en(); ecoView='subcancel';
    let m=document.getElementById('ecomodal');
    const until=E.sub&&E.sub.until?new Date(E.sub.until).toLocaleDateString(E_?'en-US':'es-AR'):'';
    m.innerHTML=`<div class="eco-bg" data-eco="close"></div><div class="eco-card-w del-card" role="dialog" aria-modal="true"><button class="eco-x" data-eco="close" aria-label="${E_?'Close':'Cerrar'}">×</button>
      <h2>${E_?'Cancel your subscription?':'¿Cancelar tu suscripción?'}</h2>
      <p class="eco-p">${ACC.me&&!ACC.me.live?(E_?'Test mode: it ends right away.':'Modo prueba: se corta en el momento.'):`${E_?'It won’t renew. You keep the benefits until':'No se va a renovar. Seguís con los beneficios hasta el'} <b>${until}</b>.`}</p>
      <div class="eco-col"><button class="btn del-go" type="button">${E_?'Cancel subscription':'Cancelar suscripción'}</button><button class="btn" data-eco="close">${E_?'Keep it':'Mantenerla'}</button></div>
      <p class="del-msg" hidden></p></div>`;
    m.hidden=false;
    const go=m.querySelector('.del-go'), msg=m.querySelector('.del-msg');
    go.onclick=async()=>{ go.disabled=true; try{ const r=await mpPost('/api/mp/sub/cancel'); setSub(r.sub); ecoOpen('store'); ecoNote(E_?'Subscription cancelled. It won’t renew.':'Suscripción cancelada. No se va a renovar.'); }
      catch(e){ go.disabled=false; msg.hidden=false; msg.textContent=E_?'Couldn’t cancel. Try again.':'No se pudo cancelar. Probá de nuevo.'; } };
  }
  window.addEventListener('click',e=>{ const t=e.target.closest&&e.target.closest('[data-eco="unsub"]'); if(!t||!ACC.user) return; e.preventDefault(); e.stopPropagation(); subCancelDialog(); },true);

  // los tickets acreditados por el servidor (cuando Mercado Pago confirmó el pago) pasan a tu saldo
  let claiming=false;
  async function claimTickets(){
    if(claiming||!ACC.user) return 0; claiming=true;
    try{
      const me=await api('POST',{claim:true}); const n=me.claimed||0;
      if(n>0){ if(ACC.wallet) await walletSync(); else { ecoTx(n,'purchase',{via:'mercadopago'}); ecoSave(); }
        setTimeout(()=>ecoNote(`${TKI}<b>+${ecoN(n)}</b> ${en()?'tickets added. Thanks for your purchase!':'tickets acreditados. ¡Gracias por tu compra!'}`,'up'),300);
        try{ if(ecoView==='store') ecoOpen('store'); else if(lobbyOpen) renderLobby(); }catch(e){} }
      return n;
    }catch(e){ return 0; } finally{ claiming=false; }
  }
  async function mpReturn(){
    const q=new URLSearchParams(location.search), mp=q.get('mp'); if(!mp) return;
    const pid=q.get('payment_id')||q.get('collection_id');
    history.replaceState(null,'',location.pathname);
    if(mp==='sub'){
      const sid=q.get('preapproval_id');
      let sub=await subRefresh(sid);
      for(let i=0;i<4&&!(sub&&sub.status==='authorized');i++){ await new Promise(r=>setTimeout(r,2500)); sub=await subRefresh(sid); }
      if(sub&&sub.status==='authorized') ecoNote(en()?'Subscription active! Unlimited games, no tickets needed.':'¡Suscripción activa! Partidas ilimitadas sin gastar tickets.','up');
      else ecoNote(en()?'Your subscription isn’t confirmed yet. It activates automatically when Mercado Pago approves it.':'Tu suscripción todavía no está confirmada. Se activa sola cuando Mercado Pago la apruebe.');
      return;
    }
    if(mp==='fail'){ ecoNote(en()?'The payment wasn’t completed. You weren’t charged.':'El pago no se completó. No se te cobró nada.'); return; }
    if(pid&&/^\d+$/.test(pid)){ try{ const tok=await window.Clerk.session.getToken(); await fetch('/api/mp/check',{method:'POST',headers:{authorization:'Bearer '+tok,'content-type':'application/json'},body:JSON.stringify({payment_id:pid})}); }catch(e){} }
    if(await claimTickets()) return;
    if(mp==='pend'){ ecoNote(en()?'Your payment is pending. Tickets will be added automatically once Mercado Pago approves it.':'Tu pago está pendiente. Cuando Mercado Pago lo apruebe, los tickets se suman solos.'); return; }
    ecoNote(en()?'Waiting for Mercado Pago’s confirmation…':'Esperando la confirmación de Mercado Pago…');
    for(let i=0;i<6;i++){ await new Promise(r=>setTimeout(r,3000)); if(await claimTickets()) return; }
    ecoNote(en()?'Mercado Pago hasn’t confirmed yet. Tickets will be added automatically when it does.':'Mercado Pago todavía no confirmó. Los tickets se suman solos apenas lo haga.');
  }
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&ACC.user) api('GET').then(me=>{ if(me){ setSub(me.sub||null); if(me.pending>0) claimTickets(); } }).catch(()=>{}); });
  window.ecoLogout=async function(){ if(E.account&&E.account.provider==='guest'){ E.account=null; ecoSave(); if(!document.getElementById('ecologin')) ecoShowLogin(); return; } try{ if(window.Clerk&&window.Clerk.user) await window.Clerk.signOut(); }catch(e){} onSignedOut(); };

  // cambios hechos en el juego (nombre, personaje, foto) se guardan en su cuenta
  let pend=null, t=0;
  const queue=o=>{ if(ACC.quiet||!ACC.user) return; pend=Object.assign(pend||{},o); clearTimeout(t); t=setTimeout(async()=>{ const b=pend; pend=null; try{ ACC.me=await api('POST',b); }catch(e){} },900); };
  const set0=Storage.prototype.setItem, rm0=Storage.prototype.removeItem;
  Storage.prototype.setItem=function(k,v){ const r=set0.apply(this,arguments); if(this===localStorage){
    if(k==='burako-name') queue({name:String(v)});
    else if(k==='burako-cav') queue({avatar:'cav:'+v});
    else if(k==='burako-photo') queue({avatar:'photo',photo:String(v)}); } return r; };
  Storage.prototype.removeItem=function(k){ return rm0.apply(this,arguments); };

  // arranque
  (async()=>{ try{
    // las vueltas de Clerk se hacen sin recargar la página (así no parpadea)
    const nav=async to=>{ const u=new URL(to,location.href); if(u.origin!==location.origin){ location.href=u.href; return; } history.replaceState(null,'',u.pathname+u.search+u.hash); };
    const C=await loadClerk(); await C.load({routerPush:nav,routerReplace:nav});
    const ssoOf=()=>new URLSearchParams(location.search).get('sso');
    if(ssoOf()==='1'){ try{ await C.handleRedirectCallback({signInFallbackRedirectUrl:location.origin+'/',signUpFallbackRedirectUrl:location.origin+'/',continueSignUpUrl:location.origin+'/?sso=2'}); }catch(e){ console.warn('callback',e); } }
    if(ssoOf()==='2'||(C.client&&C.client.signUp&&C.client.signUp.status==='missing_requirements'&&!C.user&&ssoOf())){ // cuenta nueva con Google/Facebook a la que Clerk le pide datos extra: los completamos solos
      const su=C.client&&C.client.signUp;
      try{
        if(su&&su.status==='missing_requirements'){
          const miss=su.missingFields||[], upd={};
          const base=(String(su.emailAddress||su.firstName||'jugador').split('@')[0].toLowerCase().normalize('NFD').replace(/[^a-z0-9_]/g,'').slice(0,20)||'jugador');
          if(miss.includes('username')) upd.username=(base.length<4?base+'jugador':base)+'_'+Math.floor(1000+Math.random()*9000);
          if(miss.includes('first_name')&&!su.firstName) upd.firstName=base;
          if(miss.includes('last_name')&&!su.lastName) upd.lastName='-';
          const r=await su.update(upd);
          if(r.status==='complete'&&r.createdSessionId){ await C.setActive({session:r.createdSessionId}); }
          else console.warn('faltan datos',r.missingFields);
        }
      }catch(e){ console.warn('signup',e); }
    }
    if(ssoOf()) history.replaceState(null,'',location.pathname);
    ACC.ready=true;
    if(C.user) onSignedIn(C.user); else onSignedOut();
    let last=C.user&&C.user.id; C.addListener(({user})=>{ const id=user&&user.id; if(id===last) return; last=id; if(user) onSignedIn(user); else onSignedOut(); });
  }catch(e){ waitOff(); console.warn('Clerk',e); status(en()?'Couldn’t load sign-in. Check your connection.':'No se pudo cargar el inicio de sesión. Revisá la conexión.'); } })();
})();
</script>
