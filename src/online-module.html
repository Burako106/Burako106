<script id="net-js">
/* ==========================================================================
   Burako 106 — Mesas online (1 contra 1, 3 jugadores y 2 contra 2)
   --------------------------------------------------------------------------
   Quien crea la mesa es el "anfitrión": reparte las fichas y, en los lugares
   que no ocupa ninguna persona, juega la máquina desde su navegador.
   Cada persona hace sus movimientos en su propio dispositivo y, después de
   cada movimiento, el estado de la partida viaja a los demás a través del
   servidor (Cloudflare), que además guarda el último estado para poder
   volver si alguien recarga la página o se corta internet.
   ========================================================================== */
(function(){
  const GAME=['n','hands','muertos','taken','melds','rules','pozo','mazo','turn','phase','totals','round','over','mid','goal','freeM','muertoMazo','lastDisc','actor','drawn','mode','timer','seatInfo'];
  const clone=o=>JSON.parse(JSON.stringify(o));
  const NET={role:null,code:null,ws:null,v:0,last:'',ev:[],seat:0,n:2,seats:null,open:false,on:{},retry:0,timer:null,ping:null,ui:null,pub:false,want:null,nextAt:null};
  window.BURAKO_NET=NET; NET._ui=()=>readyUI();
  // Modo prueba: los videos dan tickets sin límite (las compras ya son simuladas)
  try{ ECO.VIDEO_MAX=999; ECO.VIDEO_GAP=0; }catch(e){}
  const PEN=e=>Math.round((e||ECO.ENTRIES[0])*.5);   // penalización por abandonar: la mitad de la entrada, además de perderla
  const online=()=>!!(S&&S.kind==='online'&&NET.code&&S.net&&S.net.code===NET.code);

  /* ---------- Perspectivas ----------
     En pantalla "vos" sos siempre el asiento 0. El estado que viaja por la red
     está del lado del anfitrión; cada invitado lo gira según su asiento. */
  const NTn=n=>n===3?3:2;
  function rotArr(a,k){ if(!Array.isArray(a)) return a; const L=a.length; if(!L) return a.slice(); k=((k%L)+L)%L; return a.map((_,i)=>a[(i+k)%L]); }
  function rot(g,k){
    const o=clone(g), n=o.n||2, kt=n===3?k:k%2, fp=p=>typeof p==='number'?(((p-k)%n)+n)%n:p;
    o.hands=rotArr(o.hands,k); ['muertos','taken','melds','totals'].forEach(x=>{ o[x]=rotArr(o[x],kt); });
    o.turn=fp(o.turn); o.lastDisc=fp(o.lastDisc); o.actor=fp(o.actor);
    if(o.over){ o.over.closer=fp(o.over.closer); o.over.rows=rotArr(o.over.rows,kt); }
    return o;
  }
  function pick(){ const g={}; GAME.forEach(k=>{ g[k]=S[k]===undefined?null:S[k]; }); return clone(g); }
  const canon=()=>NET.seat?rot(pick(),-NET.seat):pick();
  const toView=c=>(c+(-NET.seat)%NET.n+NET.n)%NET.n;           // asiento real -> asiento en mi pantalla
  const toCanon=p=>(p+NET.seat)%NET.n;                          // asiento en mi pantalla -> asiento real
  const nameC=c=>{ try{ return nm(toView(c)); }catch(e){ return 'Alguien'; } };
  // El "jefe" de la mesa es la primera persona conectada: reparte y juega por la máquina.
  function bossCanon(){ const si=(S&&S.seatInfo)||[]; for(let c=0;c<si.length;c++){ const s=si[c]; if(!s||s.t==='b') continue; if(s.pid===myPid()||NET.on[s.pid]) return c; } return 0; }
  const isBoss=()=>online()&&bossCanon()===NET.seat;
  const infoAt=p=>S&&S.seatInfo&&S.seatInfo[toCanon(p)];
  NET.botTurn=()=>!!(isBoss()&&!S.over&&infoAt(S.turn)&&infoAt(S.turn).t==='b');

  /* ---------- Identidad ---------- */
  function myPid(){ let id=''; try{ id=localStorage.getItem('burako-pid')||''; if(!id){ id=Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('burako-pid',id); } }catch(e){ id=NET.tmpPid||(NET.tmpPid=Math.random().toString(36).slice(2)); } return id; }
  function myName(){ let n='Jugador'; try{ n=localStorage.getItem('burako-name')||'Jugador'; }catch(e){} return n.slice(0,18); }
  // Mi personaje: el mismo en el perfil, en el lobby y en las mesas (se guarda en este dispositivo)
  function ensureMyCav(){
    if(!(typeof myCav==='number'&&myCav>=0&&myCav<CC_AV.b.length)){
      myCav=(S&&S.cav&&S.cav[0]>=0&&S.cav[0]<CC_AV.b.length)?S.cav[0]:Math.floor(Math.random()*CC_AV.b.length);
      try{ localStorage.setItem('burako-cav',String(myCav)); }catch(e){}
    }
    return myCav;
  }
  function pickMe(el){
    const old=document.getElementById('cavpop'); if(old){ old.remove(); return; }
    const cur=ensureMyCav(), d=document.createElement('div'); d.id='cavpop'; d.className='cavpop netcav'; d.setAttribute('role','dialog'); d.setAttribute('aria-label','Elegí tu personaje');
    d.innerHTML='<span class="label">Elegí tu personaje</span><div class="cav-grid">'+CC_AV.b.map((src,i)=>'<button class="cav-it'+(i===cur?' on':'')+'" data-act="mypick" data-v="'+i+'" style="--d:'+(i*28)+'ms" aria-label="Personaje '+(i+1)+'"><img src="'+src+'" alt=""></button>').join('')+'<button class="cav-it cav-add" data-act="myphoto" aria-label="Elegir mi propia foto" title="Elegir mi propia foto">+</button></div>';
    document.body.appendChild(d);
    const r=el.getBoundingClientRect(), w=d.offsetWidth, hh=d.offsetHeight;
    d.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left))+'px';
    d.style.top=(r.bottom+12+hh<innerHeight?r.bottom+12:Math.max(8,r.top-hh-12))+'px';
  }
  function setMine(i){
    myCav=i; try{ localStorage.setItem('burako-cav',String(i)); localStorage.removeItem('burako-photo'); }catch(e){} try{ photo=null; }catch(e){}
    if(S&&S.cav&&!online()){ try{ setMyCav(i); }catch(e){} }
    // en medio de una partida online: los demás ven el cambio al instante
    if(online()&&S.seatInfo){ const c=S.seatInfo.findIndex(s=>s&&s.pid===myPid()); if(c>=0){ S.seatInfo[c].cav=i; applySeats(); render(); pushNow(true); } }
    // si estoy sentado esperando en una mesa, que los demás vean el cambio
    if(NET.code&&!online()&&NET.seats){ const s=NET.seats.find(x=>x&&x.pid===myPid()); if(s){ s.cav=i; if(NET.role==='host'){ sendSeats(); list(); } else send({t:'hello',...myWho()}); } }
    const c=document.getElementById('cavpop'); if(c) c.remove();
    try{ if(typeof renderLobby==='function') renderLobby(); }catch(e){} try{ render(); }catch(e){}
  }
  function myWho(){ return {name:myName(),cav:ensureMyCav(),pid:myPid(),seat:NET.want,cap:NET.role==='host'?NET.n-1:undefined}; }
  const okCav=c=>Number.isInteger(c)&&c>=0&&c<CC_AV.b.length;

  /* ---------- Conexión ---------- */
  function wsURL(){ return (location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?mesa='+encodeURIComponent(NET.code)+'&role='+NET.role; }
  function send(m){ if(NET.ws&&NET.ws.readyState===1){ try{ NET.ws.send(JSON.stringify(m)); return true; }catch(e){} } return false; }
  function connect(){
    clearTimeout(NET.timer);
    if(NET.ws){ try{ NET.ws.onclose=null; NET.ws.close(); }catch(e){} }
    let ws; try{ ws=new WebSocket(wsURL()); }catch(e){ schedule(); return; }
    NET.ws=ws; badge();
    ws.onopen=()=>{ NET.open=true; NET.retry=0; send({t:'hello',who:myWho()}); badge(); netUI();
      clearInterval(NET.ping); NET.ping=setInterval(()=>send({t:'ping'}),25000); };
    ws.onmessage=e=>{ let m; try{ m=JSON.parse(e.data); }catch(x){ return; } try{ onMsg(m); }catch(x){ console.error(x); } };
    ws.onclose=ev=>{ NET.open=false; clearInterval(NET.ping); badge(); netUI(); if(ev&&(ev.code===4000||ev.code===4001)) return; schedule(); };
    ws.onerror=()=>{};
  }
  function schedule(){ clearTimeout(NET.timer); const d=Math.min(15000,800*Math.pow(1.7,NET.retry++)); NET.timer=setTimeout(()=>{ if(NET.code) connect(); },d); }
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&NET.code&&(!NET.ws||NET.ws.readyState>1)){ NET.retry=0; connect(); } });
  window.addEventListener('online',()=>{ if(NET.code){ NET.retry=0; connect(); } });

  /* ---------- Mensajes ---------- */
  function onMsg(m){
    if(m.t==='pong') return;
    if(m.t==='full'){ const was=NET.role; leaveOnline(); closeUI(); toast(was==='guest'?'Esa mesa ya se llenó. Elegí otra o creá una.':'Esta mesa ya la está usando otra persona.'); lbRefresh(); return; }
    if(m.t==='sync'){
      const r=m.room||{}; NET.on={}; (m.online||[]).forEach(pid=>{ NET.on[pid]=true; });
      if(NET.role==='host'){
        if(online()){ if(r.state&&(r.v||0)>NET.v) apply(r.state,r.v,true); else pushNow(true); }
        else { // reconstruir quién está sentado (si recargué mientras esperaba)
          Object.values(r.guests||{}).forEach(w=>{ if(NET.on[w.pid]) seatGuest(w); });
          sendSeats(); list(); maybeAutoStart();
        }
      } else {
        if(r.seats) NET.seats=r.seats; if(r.n) NET.n=r.n; if(r.bet) NET.bet=r.bet; if(!online()) betCheck();
        if(r.host) NET.hostName=r.host.name;
        if(r.state&&(!online()||(r.v||0)>=NET.v)) apply(r.state,r.v||1,true); else if(online()) pushNow(true);
      }
      badge(); netUI(); return;
    }
    if(m.t==='presence'){
      if(m.on) NET.on[m.pid]=true; else delete NET.on[m.pid];
      if(NET.role==='host'&&!online()){
        if(!m.on&&m.role==='guest'){ unseat(m.pid); }
      } else if(online()){
        if(m.on&&NET.role==='host') pushNow(true);
        if(!m.on&&!S.over){ const i=(S.seatInfo||[]).findIndex(s=>s&&s.pid===m.pid); if(i>=0) toast(S.seatInfo[i].name+' se desconectó. Si no vuelve en 20 segundos, entra la máquina en su lugar.'); }
        setTimeout(()=>{ if(NET.botTurn()) runBots(); },300);
      }
      badge(); netUI(); render(); return;
    }
    if(m.t==='bye'){ if(online()){ (NET.gone=NET.gone||new Set()).add(m.pid); return; } if(NET.role==='host') unseat(m.pid); return; }
    if(m.t==='again'){ if(NET.role==='host'&&gameOver()) startRematch(m.pid); return; }
    if(m.t==='newhost'){ NET.hostPid=m.pid; if(m.pid===myPid()){ NET.role='host'; if(NET.wantClaim&&gameOver()){ NET.wantClaim=false; startRematch(myPid()); } } return; }
    if(m.t==='rematch'){
      if(!gameOver()) return; const me=myPid();
      if(!(m.seats||[]).some(x=>x&&x.pid===me)){ exitGame(); return; }
      NET.seats=m.seats; NET.n=m.n||NET.n; NET.ui='join'; NET.readyUntil=0; NET.meReady=false; NET.hostPid=(m.seats[0]||{}).pid;
      softExit(); netUI(); return; }
    if(m.t==='hello'){
      const w=m.who||{}; NET.on[w.pid]=true;
      if(NET.role==='host'){
        if(online()){ pushNow(true); }
        else if(m.from==='guest'){ seatGuest(w); sendSeats(); list(); netUI(); maybeAutoStart(); }
      } else if(m.from==='host'){ NET.hostName=w.name; }
      badge(); netUI(); return;
    }
    if(m.t==='seat'){ if(NET.role==='host'&&!online()&&NET.seats&&!NET.ready){ const i=NET.seats.findIndex(s=>s&&s.pid===m.pid), j=m.seat; if(i>0&&Number.isInteger(j)&&j>0&&j<NET.n&&!NET.seats[j]){ NET.seats[j]=NET.seats[i]; NET.seats[i]=null; sendSeats(); list(); netUI(); } } return; }
    if(m.t==='ready'){ if(NET.role==='host') markReady(m.pid); return; }
    if(m.t==='readycheck'){ if(NET.role==='guest'&&!online()){ clearTimeout(NET.selfDrop); NET.selfDrop=setTimeout(()=>{ if(NET.code&&NET.role==='guest'&&!online()&&NET.readyUntil&&!NET.meReady&&!NET.going){ send({t:'bye',pid:myPid()}); const ws=NET.ws; NET.ws=null; setTimeout(()=>{ try{ if(ws){ ws.onclose=null; ws.close(); } }catch(e){} },300); leaveOnline(); closeReady(); toast('Saliste de la mesa porque no confirmaste.'); lbRefresh(); } },READY_MS+1500); NET.seats=m.seats||NET.seats; NET.n=m.n||NET.n; NET.readyUntil=Date.now()+READY_MS; NET.scrolled=false; NET.readyState=m.ready||{}; NET.meReady=false; readyUI(); try{ bell(); }catch(e){} } return; }
    if(m.t==='readystate'){ if(NET.role==='guest'){ NET.readyState=m.ready||{}; if(NET.readyState[myPid()]) NET.meReady=true; readyUI(); } return; }
    if(m.t==='go'){ if(NET.role==='guest'&&!online()){ NET.readyUntil=0; NET.going=true; goAnim(); readyUI(); setTimeout(()=>{ NET.going=false; },GO_MS+4000); } return; }

    if((NET.readyUntil||NET.going)&&!online()){
      const st=NET.readyState||{}, seats=NET.seats||[];
      return rdDecor(s,{list:seats.map((x,i)=>x?{i,key:x.pid||x.id,ok:!!(x.t==='b'||st[x.pid]||NET.going)}:null),tot:NET.n||seats.length,me:NET.meReady,going:NET.going,until:NET.readyUntil});
    }
    s=s.replace(/<p class="lhint">[\s\S]*?<\/p>/,'<p class="lhint lnet-hint">'+hint+'</p>');
    return s.replace(/<\/div>\s*$/,acts+'</div>');
  }
  const _lth=lbTableH; lbTableH=function(t,big){ const s=_lth.apply(this,arguments); if(HOUSE&&t===HOUSE.t&&!big) return rdDecor(s,{list:houseList(HOUSE),tot:t.n,me:HOUSE.me,going:HOUSE.going,until:HOUSE.until}); return t&&t.net&&!big&&t.joined?decor(s,t):s; };
  const _lbb=lbBubH; lbBubH=function(t){ const s=_lbb.apply(this,arguments); return t&&t.net&&t.joined?s.replace('<div class="hb ','<div class="hb netmine '):s; };
  // Cuadro para compartir (con el estilo del modo elegido)
  function shareBox(){
    const box=document.getElementById('lwaitbox'); if(!box) return;
    if(!NET.share||!NET.code){ if(box._net){ box.innerHTML=''; box._h=''; box._net=false; } return; }
    const L=link(), hh='<div class="lmodal" data-n="bg"><div class="card lwait" role="dialog" aria-label="Compartir la mesa"><span class="label">Compartir la mesa</span><p class="lw-msg">Mandá este link a quien quieras invitar. Al entrar, se sienta en tu mesa.</p><div class="lw-link">'+esc(L)+'</div><button class="btn primary" data-act="netwa">Mandar por WhatsApp</button><button class="btn" data-act="netcopy">Copiar link</button><button class="btn" data-act="netback">Listo</button></div></div>';
    if(box._h!==hh){ box.innerHTML=hh; box._h=hh; box._net=true; }
  }
  function joinScreen(code,seat){
    NET.role='guest'; NET.code=code; NET.ui='ask'; NET.want=Number.isInteger(seat)?seat:null;
    const o=ov('<span class="label">¡Te invitaron a jugar!</span><p class="lw-msg">Escribí tu nombre y entrá a la mesa.</p>'+nameField()+
      '<p class="nerr"></p><button class="btn primary" data-n="go">Entrar a la mesa</button><button class="btn" data-n="cancel">Ahora no</button>');
    o.querySelector('[data-n="go"]').onclick=()=>{ if(!saveName()) return; ensureAudio(); joinNow(); };
    o.querySelector('[data-n="cancel"]').onclick=()=>{ leaveOnline(); closeUI(); };
    o.querySelector('#netname').addEventListener('keydown',e=>{ if(e.key==='Enter') o.querySelector('[data-n="go"]').click(); });
    setTimeout(()=>{ const i=document.getElementById('netname'); if(i&&!i.value) i.focus(); },50);
  }
  function joinNow(){
    try{ if(!E.account){ ecoLogin('invitado'); } }catch(e){}
    try{ const l=document.getElementById('ecologin'); if(l) l.remove(); }catch(e){}
    NET.ui='join'; NET.v=0; NET.last=''; NET.on={}; NET.seats=null; NET.hostName=null;
    netUI(); connect();
  }

  /* ---------- Indicador de conexión ---------- */
  function badge(){
    let b=document.getElementById('netbadge');
    if(!online()){ if(b) b.remove(); return; }
    if(!b){ b=document.createElement('div'); b.id='netbadge'; b.setAttribute('role','status'); document.body.appendChild(b); }
    const off=(S.seatInfo||[]).filter((s,i)=>s&&s.t!=='b'&&s.pid!==myPid()&&!NET.on[s.pid]).map(s=>s.name);
    const st=!NET.open?'off':off.length?'wait':'', tx=!NET.open?'Sin conexión… reconectando':off.length?off.join(' y ')+(off.length>1?' no están conectados':' no está conectado'):'Jugando online';
    if(b._k===st+tx) return; b._k=st+tx; clearTimeout(b._t);
    b.style.display=''; if(!st) b._t=setTimeout(()=>{ b.style.display='none'; },4000);
    b.className=st; b.innerHTML='<i></i><span></span>'; b.lastChild.textContent=tx;
  }

  /* ---------- Mesas reales en el lobby ---------- */
  const tableName=()=>'Mesa de '+myName().split(' ')[0];
  function list(){
    if(!NET.pub||NET.role!=='host'||!NET.code||online()) return;
    const body={name:tableName(),n:NET.n,bet:NET.bet,timer:pref.timer||60,seats:(NET.seats||[]).map(s=>s?{name:s.name,cav:s.cav,bot:s.t==='b'}:null),host:{name:myName(),cav:ensureMyCav()},goal:pref.goal===undefined?3000:pref.goal,rules:hostRules()};
    fetch('/api/tables?mesa='+NET.code,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(lbRefresh,()=>{});
    clearTimeout(NET.hb); NET.hb=setTimeout(list,20000);
  }
  function unlist(){ clearTimeout(NET.hb); if(NET.pub&&NET.role==='host'&&NET.code){ const c=NET.code; NET.pub=false; try{ fetch('/api/tables?mesa='+c,{method:'DELETE',keepalive:true}).then(lbRefresh,()=>{}); }catch(e){} } }
  window.addEventListener('pagehide',()=>{ if(NET.pub&&NET.role==='host'&&!online()&&NET.code){ try{ fetch('/api/tables?mesa='+NET.code,{method:'DELETE',keepalive:true}); }catch(e){} } });
  let lbAt=0, lbBusy=false;
  function seatObj(code,i,s){ const cav=okCav(s.cav)?s.cav:0;
    return {id:'nt-'+code+'-'+i,name:s.name||'Jugador',ini:'',g:CC_G[cav]||'f',cav,fun:LB_FUN[cav%LB_FUN.length],lvl:2,tone:'dulce',skin:'#e8b48f',hair:'#5a2a1a',style:1,voice:{pitch:1,rate:1},real:!(s.bot||s.t==='b')}; }
  function applyTables(arr){
    const keep=LT.filter(t=>!t.net);
    LT=(Array.isArray(arr)?arr:[]).map(t=>{ const mine=NET.role==='host'&&NET.code===t.code, n=[2,3,4].includes(t.n)?t.n:2;
      const raw=Array.isArray(t.seats)&&t.seats.length===n?t.seats:[t.host].concat(Array(n-1).fill(null));
      return {id:'net:'+t.code,net:t.code,name:t.name||'Mesa',n,timer:t.timer||60,goal:t.goal,rules:t.rules||{},bet:t.bet||0,seats:raw.map((s,i)=>s?(mine&&i===0?'me':seatObj(t.code,i,s)):null),status:'open',hand:1,mine}; }).concat(keep);
    mergeMine(); if(lobbyOpen) renderLGrid();
  }
  function lbRefresh(){
    if(lbBusy&&Date.now()-lbAt<8000) return; lbBusy=true; lbAt=Date.now(); lobbyWS();
    const ctl=('AbortController' in window)?new AbortController():null; if(ctl) setTimeout(()=>ctl.abort(),7000);
    fetch('/api/tables',{cache:'no-store',signal:ctl?ctl.signal:undefined}).then(r=>r.ok?r.json():null).then(arr=>{ if(arr) applyTables(arr); },()=>{}).finally(()=>{ lbBusy=false; });
  }
  // Conexión en vivo con el lobby: las mesas nuevas aparecen solas, al instante
  let LWS=null, lwsT=null, lwsPing=null;
  function lobbyWS(){
    if(LWS&&LWS.readyState<2) return; clearTimeout(lwsT);
    try{ LWS=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/lobby'); }catch(e){ lwsT=setTimeout(lobbyWS,4000); return; }
    LWS.onmessage=e=>{ let m; try{ m=JSON.parse(e.data); }catch(x){ return; } if(!m) return;
      if(m.t==='tables'){ lbAt=Date.now(); applyTables(m.list); }
      else if(m.t==='chathist'){ (m.list||[]).forEach(c=>clubIn(c,true)); }
      else if(m.t==='chat'){ clubIn(m.m,false); }
      else if(m.t==='vn'){ clubVn(m); } };
    LWS.onclose=()=>{ clearInterval(lwsPing); LWS=null; lwsT=setTimeout(lobbyWS,3000); };
    LWS.onerror=()=>{};
    clearInterval(lwsPing); lwsPing=setInterval(()=>{ try{ if(LWS&&LWS.readyState===1) LWS.send('ping'); }catch(e){} },25000);
  }
  /* ---------- Chat del club: mensajes reales entre todos los que están en el lobby ---------- */
  function lsend(o){ try{ if(LWS&&LWS.readyState===1){ LWS.send(JSON.stringify(o)); return true; } }catch(e){} return false; }
  const clubSeen=new Set();
  const clubP=c=>({name:c.who,cav:(Number.isInteger(c.cav)&&c.cav>=0&&c.cav<CC_AV.b.length)?c.cav:0,g:(typeof CC_G!=='undefined'&&CC_G[c.cav])||'f',real:true,tone:'dulce'});
  function clubIn(c,old){
    if(!c||!c.id||clubSeen.has(c.id)) return; clubSeen.add(c.id); if(c.pid===myPid()) return;
    const kind=['text','emoji','voice'].includes(c.kind)?c.kind:'text';
    const m={who:String(c.who||'Jugador'),p:clubP(c),txt:String(c.txt||'').slice(0,120),kind:kind==='voice'&&!lcOpt.botVoices?'text':kind};
    lbChatPush(m); if(!old&&m.kind==='voice'&&lobbyOpen&&lchatOpen) lbSpeak(m);
  }
  function clubVn(c){
    if(!c||c.pid===myPid()) return;
    try{ const bin=atob(c.data), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
      const url=URL.createObjectURL(new Blob([u],{type:c.mime||'audio/webm'}));
      lbChatPush({who:String(c.who||'Jugador'),p:clubP(c),kind:'audio',url,txt:''});
      if(lobbyOpen&&lchatOpen) vnPlay(url); }catch(e){}
  }
  const _lbSend=lbChatSend;
  lbChatSend=function(txt,kind){
    const ok=_lbSend.apply(this,arguments); if(!ok) return ok;
    const last=(LCHAT||[]).filter(m=>m.me).pop();
    lsend({t:'chat',m:{who:lbMyName(),cav:ensureMyCav(),pid:myPid(),kind:last?last.kind:(kind||'text'),txt:String(txt).trim().slice(0,120)}});
    return ok;
  };
  ['visibilitychange','focus','online','pageshow'].forEach(ev=>window.addEventListener(ev,()=>{ if(document.hidden) return; lobbyWS(); if(lobbyOpen) lbRefresh(); }));
  LT=[]; try{ clearInterval(lobbyIv); lobbyIv=null; }catch(e){}
  /* ---------- Mesas de la casa: gente que va y viene, con pocos lugares de la máquina ---------- */
  // mesas de 3: como mucho 1 máquina; mesas de 4: como mucho 2; mesas de 2: como mucho 1
  const maxBots=t=>t.n===4?2:1;
  const botCount=t=>t.seats.filter(x=>x&&x!=='me'&&!x.real).length;
  const _lbPlayer=lbPlayer, _lbTable=lbTable;
  lbPlayer=function(u){ const p=_lbPlayer(u); p.real=true; return p; };
  lbTable=function(i,u){ const t=_lbTable(i,u), filled=t.seats.map((x,k)=>x?k:-1).filter(k=>k>=0);
    let k=Math.floor(Math.random()*(maxBots(t)+1)); while(k>0&&filled.length){ const j=filled.splice(Math.floor(Math.random()*filled.length),1)[0]; t.seats[j].real=false; k--; }
    return t; };
  const fakes=()=>LT.filter(t=>!t.net);
  function fakeFill(min){ const used=new Set(); let i=0; while(fakes().length<min&&i<20){ LT.push(lbTable(i++,used)); } }
  function fakeTick(){
    const open=LT.filter(t=>!t.net&&!t.me&&!t.mine&&t.status==='open'&&!t.going);
    const R=Math.random;
    for(let n=0;n<2;n++){ if(!open.length||R()<.25) continue;
      const t=open[Math.floor(R()*open.length)], free=t.seats.filter(x=>!x).length, used=new Set(t.seats.filter(x=>x&&x!=='me').map(x=>x.name));
      if(free>1&&R()<.55){ const empties=t.seats.map((x,k)=>x?-1:k).filter(k=>k>=0), j=empties[Math.floor(R()*empties.length)]; const p=lbPlayer(used); if(botCount(t)<maxBots(t)&&R()<.2) p.real=false; t.seats[j]=p; }
      else if(free===1&&R()<.4){ const j=t.seats.indexOf(null), p=lbPlayer(used); t.seats[j]=p; t.going=true; setTimeout(()=>{ LT=LT.filter(x=>x!==t); if(lobbyOpen) renderLGrid(); },2600); }
      else if(t.n-free>1&&R()<.45){ const full=t.seats.map((x,k)=>x?k:-1).filter(k=>k>0); if(full.length) t.seats[full[Math.floor(R()*full.length)]]=null; }
    }
    const f=fakes().length;
    if(f<7||(f<11&&R()<.25)){ const nt=lbTable(Math.floor(R()*10),new Set()), real=LT.filter(t=>t.net).length; LT.splice(real+Math.floor(R()*(f+1)),0,nt); }
    if(f>9&&R()<.3){ const c=open.filter(t=>t.seats.filter(Boolean).length<=1); if(c.length){ const t=c[Math.floor(R()*c.length)]; LT=LT.filter(x=>x!==t); } }
    if(lbCompact&&hvFocus) return; renderLGrid();
  }
  fakeFill(8);
  lbInit=function(){ fakeFill(8); if(Date.now()-lbAt>3000) lbRefresh(); };
  lbTick=function(){ if(!lobbyOpen) return; try{ fakeTick(); }catch(e){} lbRefresh(); };
  try{ clearInterval(lobbyIv); }catch(e){} lobbyIv=setInterval(()=>lbTick(),4200);
  lbCreateFromPref=function(){
    if(inPlay()) return;
    const bet=ECO.ENTRIES.includes(pref.bet)?pref.bet:ECO.ENTRIES[0];
    if(!ecoGate({kind:'mesa',entry:bet},()=>lbCreateFromPref())) return;
    setupOpen=false; setupKind=null; render(); createTable(true,pref.n||2,bet); };
  function realJoin(code,seat){
    if(NET.code===code&&!online()){ if(Number.isInteger(seat)&&seat>=0) changeSeat(seat); return; }
    if(inPlay()) return;
    if(NET.code&&!online()){ toast('Ya estás en una mesa. Salí de esa antes de entrar a otra.'); return; }
    const t=LT.find(x=>x.net===code), bet=(t&&t.bet)||0;
    if(bet&&!ecoGate({kind:'mesa',entry:bet},()=>realJoin(code,seat))) return;
    NET.bet=bet; NET.betOk=code;
    leaveOnline(); ensureAudio();
    if(myName()==='Jugador'){ joinScreen(code,seat); return; }
    NET.role='guest'; NET.code=code; NET.want=Number.isInteger(seat)?seat:null; NET.bet=bet; NET.betOk=code; joinNow();
  }

  /* ---------- Aviso de versión nueva ---------- */
  const BUILD=window.BURAKO_BUILD||'';
  async function checkBuild(){
    if(!BUILD||document.getElementById('netupd')) return;
    try{ const t=await (await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'})).text(); const m=t.match(/BURAKO_BUILD='(\d+)'/);
      if(m&&m[1]!==BUILD){ const d=document.createElement('div'); d.id='netupd'; d.setAttribute('role','status');
        d.innerHTML='<span>Hay una versión nueva del juego</span><button type="button">Actualizar</button>';
        d.querySelector('button').onclick=()=>{ try{ save(); }catch(e){} location.reload(); };
        document.body.appendChild(d); } }catch(e){}
  }
  setInterval(checkBuild,60000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkBuild(); });

  /* ---------- Al abrir la página ---------- */
  function boot(){
    try{ ensureMyCav(); }catch(e){}
    const q=new URLSearchParams(location.search), code=(q.get('mesa')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    // Volver a una partida online que estaba en curso (recargó la página)
    if(S&&S.kind==='online'&&S.net&&S.net.code&&S.seatInfo&&(!code||code===S.net.code)){
      NET.role=S.net.role; NET.code=S.net.code; NET.v=S.net.v||0; NET.n=S.n;
      NET.seat=NET.role==='host'?0:Math.max(0,S.seatInfo.findIndex(s=>s&&s.pid===myPid()));
      NET.last=JSON.stringify(canon()); applySeats();
      paused=false; try{ renderPause(); }catch(e){} render(); connect();
      if(NET.botTurn()) runBots();
      return;
    }
    if(S&&S.kind==='online'){ S.kind='bot'; abandoned=true; }
    if(code.length>=4) joinScreen(code,null);
    lbRefresh();
  }
  setTimeout(boot,0);
})();
</script>
